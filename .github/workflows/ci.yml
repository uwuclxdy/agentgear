name: ci

on:
  push:
    branches: [mommy]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features --release -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --release --all-targets --all-features

  # Every other leg builds --all-features, so the zero-embed host (a github/path-only
  # consumer: `default-features = false` + `embed = false`) compiles nowhere else.
  # The derive half of that pairing is gated by host-fixture's `zero_embed` test.
  zero-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check the lib with no embed
        run: cargo check -p agentgear --no-default-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: validate test plugin tree
        run: claude plugin validate crates/agentgear/tests/fixtures/plugin --strict
      - name: validate host-fixture plugin tree
        run: claude plugin validate crates/host-fixture/plugin --strict
      - name: validate hello-mcp example plugin tree
        run: claude plugin validate examples/hello-mcp/plugin --strict
      - name: validate kitchen-sink example plugin tree
        run: claude plugin validate examples/kitchen-sink/plugin --strict
      - name: validate multi-installer example plugin tree
        run: claude plugin validate examples/multi-installer/plugin --strict
      - name: validate hooks-everywhere example plugin tree
        run: claude plugin validate examples/hooks-everywhere/plugin --strict
      - name: validate from-github example plugin tree
        run: claude plugin validate examples/from-github/plugin --strict
      # The root marketplace serves the from-github plugin from a subdir source; add
      # it + install locally (no network, no tag) so a malformed manifest or wrong
      # source path reds here instead of only in the env-gated GitHub-source e2e.
      - name: validate root marketplace
        run: |
          CFG=$(mktemp -d)
          CLAUDE_CONFIG_DIR="$CFG" claude plugin marketplace add ./ --scope user
          CLAUDE_CONFIG_DIR="$CFG" claude plugin install from-github@from-github --scope user

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      # The ignored suite drives the real `claude plugin` CLI in an isolated
      # CLAUDE_CONFIG_DIR; it is the golden drift gate (design §11). `--no-fail-fast`
      # so one red ignored test (e.g. a §2 GitHub pin) can never abort the run before
      # a later test binary and mask the golden suite the way it did 2026-07-16.
      - name: end-to-end lifecycle
        run: cargo test --all-features --no-fail-fast -- --ignored

  # One leg per non-Claude harness: build host_fixture, install the real CLI in a
  # container, and prove the tool ingests the config agentgear writes (native `mcp
  # list` where auth-free, else a config-file parse). fail-fast off so one flaky
  # upstream CLI never masks the others.
  harness-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [
          codex, opencode, gemini, cursor, cline, devin,
          qwen-code, copilot-cli, kimi, kiro, omp, openclaw, kilo,
          antigravity-cli, goose, amp, crush, droid, augment,
        ]
    steps:
      - uses: actions/checkout@v7
      - name: docker leg (${{ matrix.harness }})
        run: bash crates/host-fixture/tests/docker/run.sh ${{ matrix.harness }}
