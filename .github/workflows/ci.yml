name: ci

on:
  push:
    branches: [mommy]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features --release -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --release --all-targets --all-features

  # Every other leg builds --all-features, so the zero-embed host (a github/path-only
  # consumer: `default-features = false` + `embed = false`) compiles nowhere else.
  # The derive half of that pairing is gated by host-fixture's `zero_embed` test.
  zero-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check the lib with no embed
        run: cargo check -p agentgear --no-default-features

  # Every other leg enables all 25 agent features together (`--all-features`) or
  # none (`zero-embed`'s `--no-default-features`), so a module gated on a STALE
  # feature list — naming a backend that dropped a usage, or missing the one a
  # usage moved to — compiles clean both ways and breaks only for a real
  # consumer building exactly one feature. `cargo check` alone already turns a
  # missing/wrong `cfg` into a hard `E0432`; `RUSTFLAGS=-D warnings` additionally
  # turns the OTHER direction (a module still gated in but nothing left calling
  # it under this one feature) from a silent dead-code warning into a red build
  # (`cargo check` itself has no `-- <rustc-args>` of its own, unlike
  # `clippy`/`test`, hence the env var). The feature list comes from `cargo
  # metadata` rather than a hand-copied one here, so a newly added agent feature
  # is covered the moment it lands instead of silently falling out of this leg;
  # `default`/`derive`/`embed`/`all-agents` are the only non-agent features and
  # are excluded by name.
  single-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check every agent feature alone
        run: |
          set -euo pipefail
          export RUSTFLAGS="-D warnings"
          status=0
          feats=$(cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[] | select(.name == "agentgear") | .features | keys[]
            | select(. != "default" and . != "derive" and . != "all-agents" and . != "embed")
          ')
          # jq exits 0 on a filter that selects nothing, so a drifted package name
          # or metadata schema would silently give an empty list here and turn the
          # loop below into zero iterations plus a green `exit 0` — the exact
          # failure mode this leg exists to prevent, just one level up.
          if [ -z "$feats" ]; then
            echo "::error::derived an empty agent-feature list; the cargo metadata/jq filter has drifted"
            exit 1
          fi
          echo "checking $(printf '%s\n' "$feats" | wc -l) agent features alone"
          for feat in $feats; do
            echo "::group::feature: $feat"
            cargo check -p agentgear --no-default-features --features "$feat" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Every other leg builds for linux only, so an item reachable from a non-unix
  # build but written as if `cfg(unix)` held compiles nowhere: a `use` that only
  # the `cfg(unix)` arm of one backend needed sat red on windows at every feature
  # set until 2026-07-25, with nothing here able to see it. `cargo check --target`
  # from ubuntu covers that class at ubuntu billing rates — a check does no
  # linking, so neither the MSVC linker nor a macOS SDK has to be present, and no
  # windows/macos runner is involved. `RUSTFLAGS=-D warnings` for the same reason
  # as `single-feature` (`cargo check` has no `-- <rustc-args>` of its own):
  # without it, an item that goes unused on one target stays a silent warning.
  # These two triples reach every platform arm the tree actually branches on —
  # `windows`, `macos`, and the linux `not(any(windows, target_os = "macos"))`
  # the other legs already build. Nothing in the workspace reads `target_env` or
  # `target_arch`, and windows-gnu resolves to the same unit graph as
  # windows-msvc, so a second windows env or a second darwin arch would only
  # check identical code twice. `--all-features` buys nothing today: `all-agents`
  # is already requested inside the workspace, so a default-features `--workspace`
  # check unifies every backend onto the shared lib unit anyway. It is here so the
  # leg's reach stops depending on that — if the workspace stops requesting
  # `all-agents` a default-features build quietly narrows, while `--all-features`
  # cannot. It also keeps this leg building what `clippy` and `test` build.
  cross-target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rust-cache keys on prefix + job id + runner os/arch and never reads the
      # matrix, so both arms would compute one key, race to save it, and each pull
      # the other's unusable per-triple artifacts.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: check for ${{ matrix.target }}
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --all-features --target ${{ matrix.target }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: validate test plugin tree
        run: claude plugin validate crates/agentgear/tests/fixtures/plugin --strict
      - name: validate host-fixture plugin tree
        run: claude plugin validate crates/host-fixture/plugin --strict
      - name: validate hello-mcp example plugin tree
        run: claude plugin validate examples/hello-mcp/plugin --strict
      - name: validate kitchen-sink example plugin tree
        run: claude plugin validate examples/kitchen-sink/plugin --strict
      - name: validate multi-installer example plugin tree
        run: claude plugin validate examples/multi-installer/plugin --strict
      - name: validate hooks-everywhere example plugin tree
        run: claude plugin validate examples/hooks-everywhere/plugin --strict
      - name: validate from-github example plugin tree
        run: claude plugin validate examples/from-github/plugin --strict
      # The root marketplace serves the from-github plugin from a subdir source; add
      # it + install locally (no network, no tag) so a malformed manifest or wrong
      # source path reds here instead of only in the env-gated GitHub-source e2e.
      - name: validate root marketplace
        run: |
          CFG=$(mktemp -d)
          CLAUDE_CONFIG_DIR="$CFG" claude plugin marketplace add ./ --scope user
          CLAUDE_CONFIG_DIR="$CFG" claude plugin install from-github@from-github --scope user

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      # The ignored suite drives the real `claude plugin` CLI in an isolated
      # CLAUDE_CONFIG_DIR; it is the golden drift gate (design §11). `--no-fail-fast`
      # so one red ignored test (e.g. a §2 GitHub pin) can never abort the run before
      # a later test binary and mask the golden suite the way it did 2026-07-16.
      - name: end-to-end lifecycle
        run: cargo test --all-features --no-fail-fast -- --ignored

  # One leg per non-Claude harness: build host_fixture, install the real CLI in a
  # container, and prove the tool ingests the config agentgear writes (native `mcp
  # list` where auth-free, else a config-file parse). fail-fast off so one flaky
  # upstream CLI never masks the others.
  harness-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [
          codex, opencode, gemini, cursor, cline, devin,
          qwen-code, copilot-cli, kimi, kiro, omp, openclaw, kilo,
          antigravity-cli, goose, amp, crush, droid, augment,
        ]
    steps:
      - uses: actions/checkout@v7
      - name: docker leg (${{ matrix.harness }})
        run: bash crates/host-fixture/tests/docker/run.sh ${{ matrix.harness }}
