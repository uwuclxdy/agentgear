[package]
name = "ez-agent-plugin"
description = "Canonical install/uninstall/self-heal lifecycle for the Claude Code plugin a binary ships."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["derive", "claude"]
derive = ["dep:ez-agent-plugin-derive"]
claude = []
codex = []
opencode = []

[dependencies]
dirs = "6.0.0"
ez-agent-plugin-derive = { workspace = true, optional = true }
fastrand = "2.4.1"
fs4 = { version = "1.1.0", features = ["sync"] }
include_dir = "0.7.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
which = "8.0.4"

[target."cfg(windows)".dependencies]
junction = "2.0.0"
