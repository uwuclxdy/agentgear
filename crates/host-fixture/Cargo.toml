[package]
name = "host-fixture"
description = "internal fixture host exercising #[derive(PluginHost)] + the build guard + the full lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "host_fixture"
path = "src/main.rs"

# A github-default (`default_source = "github"`, zero-embed) host, so the
# hermetic tests can pin the config-merge-backend-under-github-source skip
# without a network or a real tag.
[[bin]]
name = "github_fixture"
path = "src/bin/github_fixture.rs"

# A github-default host WITH the embedded blob (`embed = true`), so the hermetic
# tests can pin that an explicit embedded install stays embedded through
# self_heal/uninstall instead of drifting to the github default.
[[bin]]
name = "embedded_github_fixture"
path = "src/bin/embedded_github_fixture.rs"

# A `claude` CLI test double, copied onto a scratch PATH by the hermetic
# claude-backend tests so they can run without a real (auth'd) claude.
[[bin]]
name = "fake_claude"
path = "src/bin/fake_claude.rs"

[lints]
workspace = true

# `all-agents` so `setup --agent <id>` can target any backend (default already
# supplies derive + claude + embed).
[dependencies]
agentgear = { path = "../agentgear", features = ["all-agents"] }
# The `fake_claude` bin renders and parses the registry JSON its double serves.
serde_json = "1.0.150"

[build-dependencies]
agentgear = { path = "../agentgear" }

# The hermetic harness tests parse the config files the backends write; serde
# derive backs the zed test's transcription of zed's untagged settings enum.
# (`serde_json` is a normal dependency above, which test targets also link.)
[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
