[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
# rust-version tracks the lib's actual floor: let-chains land in 1.88; 1.87
# rejects them (E0658). Every dependency's own floor is 1.85 or lower.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uwuclxdy/agentgear"
authors = ["uwuclxdy"]

[workspace.dependencies]
agentgear-derive = { path = "crates/agentgear-derive", version = "0.1.3" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
